
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const nombres = {{ nombres | tojson }};
    const cantidades = {{ cantidades | tojson }};

    new Chart(document.getElementById("graficaServicios"), {
        type: "bar",
        data: {
            labels: nombres,
            datasets: [{
                label: "Servicios más solicitados",
                data: cantidades
            }]
        }
    });
</script>
